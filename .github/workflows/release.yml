# Create GitHub Release on Tag Push
# ADR-0005: Earthly-based release validation with Pushover alerts
#
# Triggered by: Tag push (v*.*.*)
# Purpose: Create GitHub Release, run Earthly validation, send Pushover notification
#
# NOTE: This is a BACKUP workflow. Primary release method is local:
#   npm run release  # Uses semantic-release locally (faster, instant feedback)

name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_url: ${{ steps.create_release.outputs.url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD)
          else
            CHANGES="- Initial release"
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: |
            # Release ${{ steps.get_version.outputs.version }}

            ## Installation
            ```bash
            pip install gapless-crypto-data==${{ steps.get_version.outputs.version }}
            # or
            uv add gapless-crypto-data==${{ steps.get_version.outputs.version }}
            ```

            ## Changes
            ${{ steps.changelog.outputs.changes }}

            ## Links
            - [PyPI Package](https://pypi.org/project/gapless-crypto-data/${{ steps.get_version.outputs.version }}/)
            - [Documentation](https://github.com/terrylica/gapless-crypto-data#readme)
          draft: false
          prerelease: false
          generate_release_notes: true

  earthly-validate:
    name: Earthly Release Validation
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Earthly
        uses: earthly/actions-setup@v1
        with:
          version: v0.8.15

      - name: Run Earthly build
        run: earthly +build

      - name: Generate release stats
        run: |
          earthly +release-stats \
            --VERSION=${{ needs.release.outputs.version }} \
            --RELEASE_URL=${{ needs.release.outputs.release_url }}

      - name: Upload release stats
        uses: actions/upload-artifact@v4
        with:
          name: release-stats
          path: logs/release-stats.json

  pushover-notify:
    name: Send Pushover Notification
    needs: [release, earthly-validate]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Send Pushover notification
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
        run: |
          if [ -n "$PUSHOVER_USER_KEY" ] && [ -n "$PUSHOVER_APP_TOKEN" ]; then
            curl -s \
              --form-string "token=$PUSHOVER_APP_TOKEN" \
              --form-string "user=$PUSHOVER_USER_KEY" \
              --form-string "title=gapless-crypto-data Release" \
              --form-string "message=Version ${{ needs.release.outputs.version }} released successfully" \
              --form-string "url=${{ needs.release.outputs.release_url }}" \
              --form-string "url_title=View Release" \
              --form-string "priority=0" \
              https://api.pushover.net/1/messages.json
            echo "Pushover notification sent"
          else
            echo "Pushover credentials not configured, skipping notification"
          fi
