          Replaced by PyOD ensemble methods and SciPy statistical tests
        removal_date: "2025-09-17"
      typer:
        version: "0.12.0"
        removal_reason: "CLI removed in v4.0.0"
        removal_date: "2025-01-22"
      rich:
        version: "14.1.0"
        removal_reason: "CLI removed in v4.0.0"
        removal_date: "2025-01-22"
      requests:
        version: "2.32.5"
        removal_reason: >-
          Replaced with httpx for better performance and connection
