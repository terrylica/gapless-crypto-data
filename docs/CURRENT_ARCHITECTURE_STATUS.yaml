        introduced: "v3.0.0"
      pandas:
        version: "2.0.0+"
        purpose: "DataFrame operations and data manipulation"
        introduced: "v1.0.0"
      pydantic:
        version: "2.0.0+"
        purpose: >-
          Data validation and OpenAPI schema generation for validation
          reports
        introduced: "v4.0.0"
      pyarrow:
        version: "16.0.0+"
        purpose: "Parquet I/O engine for pandas (df.to_parquet/read_parquet)"
        introduced: "v2.0.0"
      python_dotenv:
        version: "1.0.0+"
        purpose: >-
          Environment variable management for database configuration
        introduced: "v4.0.0"

    dependencies_removed:
