# QuestDB Docker Compose for macOS Development
# Optimized for Colima runtime (NOT Docker Desktop)
#
# Prerequisites:
# - Colima installed via Homebrew: brew install colima
# - Colima started with VirtioFS: colima start --mount-type virtiofs --cpu 4 --memory 8
# - Docker CLI installed: brew install docker
#
# Usage:
#   colima start --mount-type virtiofs --cpu 4 --memory 8
#   docker-compose -f deployment/docker-compose.macos.yml up -d
#   docker-compose -f deployment/docker-compose.macos.yml logs -f
#   docker-compose -f deployment/docker-compose.macos.yml down
#
# Performance Notes:
# - Named volumes provide 3.5x faster I/O than bind mounts on macOS
# - VirtioFS is 2-3x faster than gRPC-FUSE (macOS 13+)
# - Expected IOPS: ~2,786 (vs 1,545 with Docker Desktop)

version: '3.8'

services:
  questdb:
    image: questdb/questdb:9.2.0
    container_name: gapless-questdb

    # Port mappings
    ports:
      - "9000:9000"   # HTTP REST API & Web Console
      - "8812:8812"   # PostgreSQL wire protocol
      - "9009:9009"   # InfluxDB Line Protocol (ILP)
      - "9003:9003"   # Prometheus metrics (optional)

    # Named volume for optimal performance (NOT bind mount)
    volumes:
      - questdb_data:/var/lib/questdb

    # Environment configuration
    environment:
      # Metrics and monitoring
      - QDB_METRICS_ENABLED=true

      # Memory configuration (adjust based on available RAM)
      # Default: 1GB min heap, 2GB max heap (sufficient for development)
      # Production: Increase to 24-48GB for high-throughput ingestion
      - JAVA_OPTS=-Xms1g -Xmx2g

      # WAL configuration (for concurrent writes)
      - QDB_CAIRO_WAL_ENABLED_DEFAULT=true

      # Time zone (UTC for consistency)
      - TZ=UTC

    # Health check using bash built-ins (not curl/wget)
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9000 || exit 1'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Restart policy
    restart: unless-stopped

    # Resource limits (adjust based on workload)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

# Named volume definition
volumes:
  questdb_data:
    driver: local
    # Volume is managed by Colima VM
    # No driver_opts needed (Colima handles VirtioFS automatically)

# Network configuration (optional)
networks:
  default:
    name: gapless-network
    driver: bridge

# Usage examples:
#
# 1. Start QuestDB:
#    docker-compose -f deployment/docker-compose.macos.yml up -d
#
# 2. Access Web Console:
#    open http://localhost:9000
#
# 3. Test PostgreSQL connection:
#    psql -h localhost -p 8812 -U admin -d qdb
#
# 4. View logs:
#    docker-compose -f deployment/docker-compose.macos.yml logs -f questdb
#
# 5. Stop and remove:
#    docker-compose -f deployment/docker-compose.macos.yml down
#
# 6. Stop and remove with data:
#    docker-compose -f deployment/docker-compose.macos.yml down -v
#
# 7. View metrics:
#    curl http://localhost:9003/metrics
